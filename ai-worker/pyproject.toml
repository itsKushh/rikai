[project]
name = "rikai-worker"
version = "0.7.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "av==15.1.0", "huggingface-hub==0.36.0", "faster-whisper==1.2.1", "ctranslate2==4.9.1",
  "filelock==4.3.0", "sherpa-onnx==1.12.39", "sherpa-onnx-core==1.12.39", "numpy==2.2.6", "sentencepiece==0.2.1", "py3langid==0.3.0",
]
[project.optional-dependencies]
summary = ["llama-cpp-python==0.3.37"]
packaging = ["pyinstaller==6.22.3"]
[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

