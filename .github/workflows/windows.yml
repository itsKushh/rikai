name: Compilation Windows x64
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Construire, tester et assembler
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingNotes-Windows-x64
          path: dist/MeetingNotes-Setup-x64.exe
          if-no-files-found: error

