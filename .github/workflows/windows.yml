name: Compilation Windows x64
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_run:
        description: "Vérifier à nouveau l’installeur d’une compilation main (facultatif)"
        type: string
        required: false
  pull_request:
permissions:
  contents: read
jobs:
  package:
    if: ${{ !inputs.package_run }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Installer les dépendances Python
        timeout-minutes: 30
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Dependencies
      - name: Tester le worker Python et le protocole IPC
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage PythonTests
      - name: Compiler et tester le workspace Rust en release
        timeout-minutes: 60
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage RustTests
      - name: Construire les exécutables Windows
        timeout-minutes: 30
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Binaries
      - name: Assembler et vérifier le worker autonome
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Worker
      - name: Construire l’installeur guidé Rikai
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Installer
      - name: Vérifier l’installation utilisateur et la version du binaire
        shell: pwsh
        run: ./scripts/test-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Rikai-Windows-x64
          path: dist/Rikai-Setup-x64.exe
          if-no-files-found: error

  installer-test:
    needs: package
    if: ${{ !cancelled() && (needs.package.result == 'success' || (needs.package.result == 'skipped' && inputs.package_run)) }}
    permissions:
      actions: read
      contents: read
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier l’origine et les sources de l’installeur existant
        if: inputs.package_run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
        run: |
          if ($env:PACKAGE_RUN -notmatch '^[0-9]+$') { throw 'Identifiant de compilation invalide.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PACKAGE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_branch -ne 'main' -or $run.event -notin 'push','workflow_dispatch' -or
              $run.path -ne '.github/workflows/windows.yml' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
            throw 'Compilation main de Rikai requise.'
          }
          git merge-base --is-ancestor $run.head_sha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Révision de compilation étrangère à cet historique.' }
          git diff --quiet $run.head_sha HEAD -- . ':(exclude).github/workflows/windows.yml' ':(exclude)scripts/test-installer-ui.ps1' ':(exclude)scripts/TestInstallerWindow.cs'
          if ($LASTEXITCODE -ne 0) { throw 'Les sources ont changé. Lancez une nouvelle compilation.' }
      - uses: actions/download-artifact@v4
        with:
          name: Rikai-Windows-x64
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run || github.run_id }}
      - name: Tester le parcours guidé, son annulation et sa reprise
        timeout-minutes: 10
        shell: powershell
        run: ./scripts/test-installer-ui.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Rikai-Installer-Previews
          path: dist/installer-previews/*.png
          if-no-files-found: error

  release:
    needs: installer-test
    if: ${{ !cancelled() && needs.installer-test.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: rikai-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Rikai-Windows-x64
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run || github.run_id }}
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          tag="v$version"
          notes="releases/$tag.md"
          test -s "$notes"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/rikai-release-state"; then
            if [[ $(cat "$RUNNER_TEMP/rikai-release-state") == false ]]; then exit 0; fi
            gh release upload "$tag" dist/Rikai-Setup-x64.exe --clobber
            gh release edit "$tag" --notes-file "$notes" --draft=false
          else
            gh release create "$tag" dist/Rikai-Setup-x64.exe --target "$GITHUB_SHA" --title "Rikai $version" --notes-file "$notes"
          fi
