name: Compilation Windows x64
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Installer les dépendances Python
        timeout-minutes: 30
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Dependencies
      - name: Tester le worker Python et le protocole IPC
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage PythonTests
      - name: Compiler et tester le workspace Rust en release
        timeout-minutes: 60
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage RustTests
      - name: Construire les exécutables Windows
        timeout-minutes: 30
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Binaries
      - name: Assembler et vérifier le worker autonome
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Worker
      - name: Créer l’installeur Inno Setup
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Installer
      - name: Vérifier l’installation utilisateur et la version du binaire
        shell: pwsh
        run: ./scripts/test-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Rikai-Windows-x64
          path: dist/Rikai-Setup-x64.exe
          if-no-files-found: error

  release:
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rikai-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Rikai-Windows-x64
          path: dist
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          tag="v$version"
          notes="releases/$tag.md"
          test -s "$notes"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/rikai-release-state"; then
            if [[ $(cat "$RUNNER_TEMP/rikai-release-state") == false ]]; then exit 0; fi
            gh release upload "$tag" dist/Rikai-Setup-x64.exe --clobber
            gh release edit "$tag" --notes-file "$notes" --draft=false
          else
            gh release create "$tag" dist/Rikai-Setup-x64.exe --target "$GITHUB_SHA" --title "Rikai $version" --notes-file "$notes"
          fi
