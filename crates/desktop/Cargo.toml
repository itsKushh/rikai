[package]
name = "rikai"
version.workspace = true
edition.workspace = true
[target.'cfg(windows)'.dependencies]
audio-capture = { path = "../audio-capture" }
meeting-storage = { path = "../meeting-storage" }
anyhow.workspace = true
serde_json.workspace = true
regex = "1"
gpui = { package = "gpui-ce", version = "=0.3.0", default-features = false }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0", default-features = false }
tempfile = "3"
unicode-segmentation = "1"
rfd = "=0.17.2"
gpui_ce_elements = "=0.3.0"

windows = { version="=0.62.2", features=["Win32_Media_Multimedia"] }
sysinfo = { version="=0.38.4", default-features=false, features=["system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt","std"] }

[dev-dependencies]
anyhow.workspace = true
serde_json.workspace = true
regex = "1"

[build-dependencies]
embed-resource = "=3.0.12"
