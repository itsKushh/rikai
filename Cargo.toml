[workspace]
resolver = "3"
members = ["crates/audio-capture", "crates/meeting-storage", "crates/desktop"]
[workspace.package]
edition = "2024"
version = "0.2.0"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5.1"
[profile.dev]
debug = 0
